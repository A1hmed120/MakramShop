<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أورانج | إدارة المبيعات والمخزون</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<style>
:root{--or:#FF7900;--bd:#1A1A1A;--bg:#F5F5F5;--card:#fff;--tx:#1A1A1A;--mu:#666;--ln:#e3e3e3;--red:#D32F2F;--grn:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--card:#1f1f1f;--tx:#f2f2f2;--mu:#aaa;--ln:#333}}
:root[data-theme="dark"]{--bg:#111;--card:#1f1f1f;--tx:#f2f2f2;--mu:#aaa;--ln:#333}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tajawal,system-ui,sans-serif}
header{background:#1A1A1A;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .logo{background:var(--or);width:34px;height:34px;border-radius:6px;display:grid;place-items:center;font-weight:800;color:#fff}
header b{font-size:17px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--ln)}
nav button{border:0;background:transparent;color:var(--tx);font:600 14px Cairo,sans-serif;padding:9px 14px;border-radius:10px;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--or);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid var(--ln)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.kpi small{color:var(--mu)}.kpi .v{font-size:28px;font-weight:800;color:var(--or)}.kpi .s{font-size:12px;color:var(--mu)}
.bar{height:6px;background:var(--ln);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--or)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu);flex:1;min-width:150px}
input,select,textarea{font:inherit;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);width:100%}
button.p{background:var(--or);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:700 15px Cairo,sans-serif;cursor:pointer}
button.p:disabled{opacity:.5}
button.g{background:transparent;border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:6px 10px;font:600 12px Cairo,sans-serif;cursor:pointer}
button.g.d{color:var(--red)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:11px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font:600 14px Cairo,sans-serif;cursor:pointer}.seg .on{background:var(--bd);color:#fff;border-color:var(--bd)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:600}
.badge{padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700}.low{background:#fde8e8;color:var(--red)}.ok{background:#e6f4e7;color:var(--grn)}
h3{margin:0 0 12px}.av{font-weight:700;margin:-4px 0 10px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:12px 18px;border-radius:12px;z-index:9;display:none;max-width:90%}
#toast.err{background:var(--red)}
.empty{text-align:center;color:var(--mu);padding:24px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;align-items:center;justify-content:center;padding:16px}
.mb{background:var(--card);color:var(--tx);border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
svg text{fill:var(--mu);font:11px Cairo,sans-serif}
</style>
</head>
<body>
<header><div class="logo">O</div><b>أورانج | إدارة المبيعات والمخزون</b><button class="g" id="lo" style="display:none;margin-inline-start:auto;color:#fff;border-color:#666" onclick="logout()">خروج</button></header>
<nav id="nav"></nav>
<main id="app"><div class="empty">جاري التحميل…</div></main>
<div id="modal"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tz=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let sb=null,user=null,tab='dash',busy=false,subscribed=false;
const S={branches:[],emps:[],types:[],inv:[],sales:[]};
const COL={branches:'branches',emps:'employees',types:'simTypes',inv:'inventory',sales:'sales'};
const LD=new Set();
const F={b:'',e:'',day:tz()};
const E={b:'',e:'',t:'',sh:'morning',d:tz(),q:'',n:''};
const L={q:'',b:'',from:'',to:''};
const TABS=[['dash','لوحة التحكم'],['entry','تسجيل مبيعات'],['inv','الفروع والمخزون'],['emps','الموظفون والتارجت'],['log','سجل المبيعات']];
const nm=(l,id)=>(S[l].find(x=>x.id===id)||{}).name||'—';
const SH={morning:'صباحي',evening:'مسائي'};
const sum=a=>a.reduce((s,x)=>s+(+x.qty||0),0);
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
const opts=(l,sel,all,filter)=>(all?`<option value="">${all}</option>`:'<option value="">اختر…</option>')+S[l].filter(filter||(()=>1)).map(x=>`<option value="${esc(x.id)}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('');
let raf;function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}

function draw(){
  $('#nav').innerHTML=TABS.map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
  const el=$('#app');
  $('#lo').style.display=user?'':'none';
  if(!sb||!user){el.innerHTML=vAuth();return}
  if(LD.size<5){el.innerHTML='<div class="empty">جاري التحميل…</div>';return}
  if(!S.branches.length&&!S.types.length){el.innerHTML=`<div class="card empty"><h3>إعداد أولي</h3><p>لا توجد بيانات بعد. أنشئ أنواع الخطوط والفرعين المبدئيين (يمكنك تعديلها لاحقاً).</p><button class="p" onclick="seed()">إنشاء الإعداد الأولي</button></div>`;return}
  el.innerHTML=({dash:vDash,entry:vEntry,inv:vInv,emps:vEmps,log:vLog})[tab]();
}
function go(t){tab=t;render()}

/* ---------- Dashboard ---------- */
function vDash(){
  const m=F.day.slice(0,7);
  const fs=S.sales.filter(s=>(!F.b||s.branchId===F.b)&&(!F.e||s.empId===F.e));
  const ms=fs.filter(s=>s.date.slice(0,7)===m);
  const today=sum(fs.filter(s=>s.date===F.day));
  const emps=S.emps.filter(e=>e.active!==false&&(!F.b||e.branchId===F.b)&&(!F.e||e.id===F.e));
  const target=emps.reduce((s,e)=>s+(+e.target||0),0);
  const inv=S.inv.filter(i=>!F.b||i.branchId===F.b);
  const low=inv.filter(i=>i.qty<(i.min??20)).length;
  const by={};ms.forEach(s=>by[s.empId]=(by[s.empId]||0)+s.qty);
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
  const pct=target?Math.min(100,Math.round(sum(ms)/target*100)):null;
  const days={};ms.forEach(s=>{const d=+s.date.slice(8);days[d]=(days[d]||0)+s.qty});
  const bb={};ms.forEach(s=>bb[s.branchId]=(bb[s.branchId]||0)+s.qty);
  const emF=S.emps.filter(e=>!F.b||e.branchId===F.b);
  return `<div class="card"><div class="row" style="margin:0">
  <label>الفرع<select onchange="F.b=this.value;F.e='';render()">${opts('branches',F.b,'كل الفروع')}</select></label>
  <label>الموظف<select onchange="F.e=this.value;render()"><option value="">كل الموظفين</option>${emF.map(e=>`<option value="${esc(e.id)}" ${e.id===F.e?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label>
  <label>التاريخ<input type="date" value="${F.day}" onchange="F.day=this.value||tz();render()"></label></div></div>
  <div class="grid">
  <div class="card kpi"><small>مبيعات اليوم</small><div class="v">${today}</div><div class="s">خط أورانج</div></div>
  <div class="card kpi"><small>مبيعات الشهر</small><div class="v">${sum(ms)}</div><div class="s">${pct==null?'لا يوجد تارجت':`التارجت ${target} — ${pct}%`}</div>${pct==null?'':`<div class="bar"><i style="width:${pct}%"></i></div>`}</div>
  <div class="card kpi"><small>المخزون المتاح</small><div class="v" style="color:${low?'var(--red)':'var(--tx)'}">${inv.reduce((s,i)=>s+i.qty,0)}</div><div class="s">${low?`⚠ ${low} صنف تحت الحد الأدنى`:'كل الأصناف سليمة'}</div></div>
  <div class="card kpi"><small>الأعلى مبيعاً</small><div class="v" style="font-size:22px">${top?esc(nm('emps',top[0])):'—'}</div><div class="s">${top?top[1]+' خط هذا الشهر':''}</div></div></div>
  <div class="card"><h3>المبيعات اليومية خلال الشهر</h3>${line(days,+F.day.slice(8))}</div>
  <div class="card"><h3>أداء الفروع (الشهر)</h3>${bars(Object.entries(bb).map(([k,v])=>[nm('branches',k),v]))}</div>`;
}
function line(days,n){
  const last=new Date(+F.day.slice(0,4),+F.day.slice(5,7),0).getDate();
  const max=Math.max(1,...Object.values(days));const W=640,H=200,p=28;
  const pts=[...Array(last)].map((_,i)=>[p+i*(W-2*p)/(last-1||1),H-p-((days[i+1]||0)/max)*(H-2*p)]);
  return `<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="min-width:480px;width:100%"><polyline fill="none" stroke="#FF7900" stroke-width="3" points="${pts.map(q=>q.join(',')).join(' ')}"/>${pts.map((q,i)=>days[i+1]?`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#FF7900"><title>يوم ${i+1}: ${days[i+1]}</title></circle>`:'').join('')}${[1,Math.ceil(last/2),last].map(d=>`<text x="${p+(d-1)*(W-2*p)/(last-1||1)}" y="${H-6}" text-anchor="middle">${d}</text>`).join('')}<text x="4" y="${p}">${max}</text></svg></div>`;
}
function bars(a){
  if(!a.length)return '<div class="empty">لا توجد مبيعات هذا الشهر</div>';
  const max=Math.max(...a.map(x=>x[1]));
  return a.sort((x,y)=>y[1]-x[1]).map(([n,v])=>`<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><span style="width:130px;font-size:13px">${esc(n)}</span><div class="bar" style="flex:1;height:18px;margin:0"><i style="width:${v/max*100}%"></i></div><b>${v}</b></div>`).join('');
}

/* ---------- Quick entry ---------- */
function vEntry(){
  const inv=S.inv.find(i=>i.id===E.b+'_'+E.t);
  const av=E.b&&E.t?(inv?inv.qty:0):null;
  return `<div class="card" style="max-width:560px;margin:auto"><h3>تسجيل مبيعات الشفت</h3>
  <label>الفرع<select onchange="E.b=this.value;E.e='';render()">${opts('branches',E.b)}</select></label><br>
  <label>الموظف<select onchange="E.e=this.value">${opts('emps',E.e,'',x=>x.active!==false&&x.branchId===E.b)}</select></label><br>
  <div class="seg"><button class="${E.sh==='morning'?'on':''}" onclick="E.sh='morning';render()">☀ صباحي</button><button class="${E.sh==='evening'?'on':''}" onclick="E.sh='evening';render()">🌙 مسائي</button></div><br>
  <label>نوع الخط<select onchange="E.t=this.value;render()">${opts('types',E.t)}</select></label><br>
  ${av!=null?`<div class="av" style="color:${av<20?'var(--red)':'var(--grn)'}">المتاح في المخزون: ${av} خط</div>`:''}
  <label>التاريخ<input type="date" value="${E.d}" max="${tz()}" onchange="E.d=this.value"></label><br>
  <label>عدد الخطوط المباعة<input type="number" min="1" inputmode="numeric" value="${esc(E.q)}" oninput="E.q=this.value"></label><br>
  <label>ملاحظات (اختياري)<textarea rows="2" oninput="E.n=this.value">${esc(E.n)}</textarea></label><br>
  <button class="p" style="width:100%" onclick="saveSale()" ${busy?'disabled':''}>حفظ</button></div>`;
}
async function saveSale(){
  const q=+E.q;
  if(!E.b||!E.e||!E.t||!E.d||!(q>0)||!Number.isInteger(q))return toast('أكمل كل الحقول وأدخل عدداً صحيحاً أكبر من صفر',1);
  const inv=S.inv.find(i=>i.id===E.b+'_'+E.t),av=inv?inv.qty:0;
  if(q>av)return toast(`المخزون غير كافٍ! المتاح في هذا الفرع: ${av} خط`,1);
  busy=true;render();
  if(await w(()=>sb.from('sales').insert({sale_date:E.d,branch_id:E.b,employee_id:E.e,sim_type_id:E.t,shift:E.sh,quantity:q,notes:E.n.trim()||null}),'تم تسجيل المبيعات وخصم الكمية من المخزون ✅')){E.q='';E.n=''}
  busy=false;render();
}
/* ---------- Branches & stock ---------- */
function vInv(){
  return `<div class="card"><h3>الفروع</h3><div class="row"><label>اسم فرع جديد<input id="nb"></label><button class="p" onclick="addBranch()">إضافة فرع</button></div>
  <div class="tw"><table><tr><th>الفرع</th><th></th></tr>${S.branches.map(b=>`<tr><td>${esc(b.name)}</td><td><button class="g" onclick="renBranch('${b.id}')">تعديل الاسم</button> <button class="g d" onclick="delBranch('${b.id}')">حذف</button></td></tr>`).join('')}</table></div></div>
  <div class="card"><h3>توريد / إضافة مخزون جديد</h3><div class="row">
  <label>الفرع<select id="sb">${opts('branches','')}</select></label>
  <label>نوع الخط<select id="st">${opts('types','')}</select></label>
  <label>الكمية<input id="sq" type="number" min="1"></label>
  <button class="p" onclick="supply()">توريد</button></div></div>
  <div class="card"><h3>رصيد المخزون</h3><div class="tw"><table><tr><th>الفرع</th><th>نوع الخط</th><th>الرصيد</th><th>الحد الأدنى</th><th>الحالة</th><th></th></tr>
  ${S.inv.length?S.inv.map(i=>`<tr><td>${esc(nm('branches',i.branchId))}</td><td>${esc(nm('types',i.typeId))}</td><td><b>${i.qty}</b></td><td>${i.min??20}</td><td><span class="badge ${i.qty<(i.min??20)?'low':'ok'}">${i.qty<(i.min??20)?'⚠ نقص':'سليم'}</span></td><td><button class="g" onclick="setMin('${i.id}')">الحد الأدنى</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">لا يوجد مخزون — ابدأ بتوريد شحنة</td></tr>'}</table></div></div>
  <div class="card"><h3>أنواع الخطوط</h3><div class="row"><label>نوع جديد<input id="nt"></label><button class="p" onclick="addType()">إضافة</button></div><div class="tw"><table>${S.types.map(t=>`<tr><td>${esc(t.name)}</td><td><button class="g" onclick="typeEdit('${t.id}')">تعديل</button> <button class="g d" onclick="typeDel('${t.id}')">حذف</button></td></tr>`).join('')}</table></div></div>`;
}
async function w(fn,ok){
  try{const r=await fn();if(r&&r.error)throw r.error;if(ok)toast(ok);await loadAll();return true}
  catch(e){const m=e.message||e.code||'';toast(m.includes('INSUFFICIENT_STOCK')?'المخزون غير كافٍ لهذه العملية':'تعذّر التنفيذ: '+m,1);return false}
}
function addBranch(){const n=$('#nb').value.trim();if(!n)return;w(()=>sb.from('branches').insert({name:n}),'تمت إضافة الفرع')}
function modal(title,fields,okText){return new Promise(res=>{
  const m=$('#modal');
  m.innerHTML=`<div class="mb"><h3>${esc(title)}</h3>${fields.map((f,i)=>f.msg?`<p>${esc(f.msg)}</p>`:`<label>${esc(f.label)}${f.opts?`<select id="mf${i}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===f.value?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input id="mf${i}" type="${f.type||'text'}" value="${esc(f.value??'')}" ${f.min!=null?`min="${f.min}"`:''}>`}</label><br>`).join('')}<div class="row" style="margin:0"><button class="p" id="mok">${okText||'حفظ'}</button><button class="g" id="mno" style="padding:12px 18px">إلغاء</button></div></div>`;
  m.style.display='flex';
  const close=v=>{m.style.display='none';m.innerHTML='';res(v)};
  $('#mno').onclick=()=>close(null);
  $('#mok').onclick=()=>{const v=fields.map((f,i)=>f.msg?null:$('#mf'+i).value);close(v)};
  m.onclick=e=>{if(e.target===m)close(null)};
})}
const sure=msg=>modal('تأكيد',[{msg}],'تأكيد');
async function renBranch(id){const r=await modal('تعديل الفرع',[{label:'الاسم',value:nm('branches',id)}]);if(r&&r[0].trim())w(()=>sb.from('branches').update({name:r[0].trim()}).eq('id',id),'تم تعديل الفرع')}
async function delBranch(id){
  if(S.emps.some(e=>e.branchId===id)||S.inv.some(i=>i.branchId===id)||S.sales.some(s=>s.branchId===id))return toast('لا يمكن حذف فرع له موظفون أو مخزون أو مبيعات',1);
  if(await sure('حذف الفرع «'+nm('branches',id)+'»؟'))w(()=>sb.from('branches').delete().eq('id',id),'تم حذف الفرع')}
async function typeEdit(id){const r=await modal('تعديل نوع الخط',[{label:'الاسم',value:nm('types',id)}]);if(r&&r[0].trim())w(()=>sb.from('sim_types').update({name:r[0].trim()}).eq('id',id),'تم التعديل')}
async function typeDel(id){
  if(S.inv.some(i=>i.typeId===id)||S.sales.some(s=>s.typeId===id))return toast('لا يمكن حذف نوع له مخزون أو مبيعات',1);
  if(await sure('حذف النوع «'+nm('types',id)+'»؟'))w(()=>sb.from('sim_types').delete().eq('id',id),'تم الحذف')}
function addType(){const n=$('#nt').value.trim();if(!n)return;w(()=>sb.from('sim_types').insert({name:n}),'تمت إضافة النوع')}
function supply(){
  const b=$('#sb').value,t=$('#st').value,q=+$('#sq').value;
  if(!b||!t||!(q>0)||!Number.isInteger(q))return toast('اختر الفرع والنوع وأدخل كمية صحيحة',1);
  w(()=>sb.from('stock_receipts').insert({branch_id:b,sim_type_id:t,quantity:q,received_at:tz()}),`تم توريد ${q} خط`);
}
async function setMin(id){const i=S.inv.find(x=>x.id===id),r=await modal('الحد الأدنى للتنبيه',[{label:'الحد الأدنى (خط)',type:'number',min:0,value:i.min??20}]);if(r&&r[0]!==''&&+r[0]>=0)w(()=>sb.from('inventory').update({min_threshold:+r[0]}).eq('branch_id',i.branchId).eq('sim_type_id',i.typeId),'تم الحفظ')}
async function seed(){
  await w(async()=>{
    let r=await sb.from('sim_types').insert(['خط فويس / كارت','خط داتا / إنترنت','خط بيزنس / فواتير'].map(name=>({name})));if(r.error)return r;
    return sb.from('branches').insert(['فرع سوهاج الرئيسي','فرع المحطة'].map(name=>({name})));
  },'تم الإعداد الأولي');
}
/* ---------- Employees ---------- */
function vEmps(){
  const m=tz().slice(0,7);
  return `<div class="card"><h3>إضافة موظف</h3><div class="row"><label>الاسم<input id="en"></label>
  <label>الفرع<select id="eb">${opts('branches','')}</select></label>
  <label>التارجت الشهري (اختياري)<input id="et" type="number" min="0"></label><button class="p" onclick="addEmp()">إضافة</button></div></div>
  <div class="card"><h3>الموظفون والتارجت (الشهر الحالي)</h3><div class="tw"><table><tr><th>الموظف</th><th>الفرع</th><th>المبيعات</th><th>التارجت</th><th>التحقيق</th><th>الحالة</th><th></th></tr>
  ${S.emps.length?S.emps.map(e=>{const s=sum(S.sales.filter(x=>x.empId===e.id&&x.date.slice(0,7)===m));const p=e.target?Math.round(s/e.target*100):null;
  return `<tr><td>${esc(e.name)}</td><td>${esc(nm('branches',e.branchId))}</td><td><b>${s}</b></td><td>${e.target||'—'}</td><td>${p==null?'—':p+'%'}</td><td><span class="badge ${e.active===false?'low':'ok'}">${e.active===false?'موقوف':'نشط'}</span></td>
  <td><button class="g" onclick="empEdit('${e.id}')">تعديل</button> <button class="g" onclick="empToggle('${e.id}')">${e.active===false?'تفعيل':'إيقاف'}</button> <button class="g d" onclick="empDel('${e.id}')">حذف</button></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">لا يوجد موظفون</td></tr>'}</table></div></div>`;
}
function addEmp(){const n=$('#en').value.trim(),b=$('#eb').value,t=+$('#et').value||0;if(!n||!b)return toast('أدخل الاسم واختر الفرع',1);w(()=>sb.from('employees').insert({full_name:n,branch_id:b,monthly_target:t,is_active:true}),'تمت إضافة الموظف')}
async function empEdit(id){
  const e=S.emps.find(x=>x.id===id);
  const r=await modal('تعديل الموظف',[{label:'الاسم',value:e.name},{label:'الفرع',opts:S.branches.map(b=>[b.id,b.name]),value:e.branchId},{label:'التارجت الشهري',type:'number',min:0,value:e.target||0}]);
  if(!r)return;if(!r[0].trim())return toast('الاسم مطلوب',1);
  w(()=>sb.from('employees').update({full_name:r[0].trim(),branch_id:r[1],monthly_target:+r[2]||0}).eq('id',id),'تم تعديل الموظف')}
async function empDel(id){
  if(S.sales.some(s=>s.empId===id))return toast('للموظف مبيعات مسجلة — استخدم «إيقاف» بدل الحذف',1);
  if(await sure('حذف الموظف «'+nm('emps',id)+'»؟'))w(()=>sb.from('employees').delete().eq('id',id),'تم حذف الموظف')}
function empToggle(id){const e=S.emps.find(x=>x.id===id);w(()=>sb.from('employees').update({is_active:e.active===false}).eq('id',id))}
/* ---------- Sales log ---------- */
function logRows(){
  return S.sales.filter(s=>(!L.b||s.branchId===L.b)&&(!L.from||s.date>=L.from)&&(!L.to||s.date<=L.to)&&
    (!L.q||[nm('emps',s.empId),nm('branches',s.branchId),nm('types',s.typeId),s.notes||''].join(' ').includes(L.q)))
    .sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
}
function vLog(){
  const r=logRows();
  return `<div class="card"><div class="row" style="margin:0"><label>بحث<input value="${esc(L.q)}" oninput="L.q=this.value;logOnly()" id="lq"></label>
  <label>الفرع<select onchange="L.b=this.value;render()">${opts('branches',L.b,'الكل')}</select></label>
  <label>من<input type="date" value="${L.from}" onchange="L.from=this.value;render()"></label>
  <label>إلى<input type="date" value="${L.to}" onchange="L.to=this.value;render()"></label>
  <button class="p" onclick="exportCsv()">تصدير CSV</button></div></div>
  <div class="card"><div class="tw" id="lt">${logTable(r)}</div></div>`;
}
function logTable(r){
  return `<table><tr><th>التاريخ</th><th>الفرع</th><th>الموظف</th><th>الشفت</th><th>نوع الخط</th><th>العدد</th><th>ملاحظات</th><th></th></tr>
  ${r.length?r.map(s=>`<tr><td>${s.date}</td><td>${esc(nm('branches',s.branchId))}</td><td>${esc(nm('emps',s.empId))}</td><td>${SH[s.shift]}</td><td>${esc(nm('types',s.typeId))}</td><td><b>${s.qty}</b></td><td>${esc(s.notes||'')}</td>
  <td><button class="g" onclick="editSale('${s.id}')">تعديل</button> <button class="g d" onclick="delSale('${s.id}')">حذف</button></td></tr>`).join('')+`<tr><td colspan="5"><b>الإجمالي</b></td><td><b>${sum(r)}</b></td><td colspan="2"></td></tr>`:'<tr><td colspan="8" class="empty">لا توجد عمليات</td></tr>'}</table>`;
}
function logOnly(){$('#lt').innerHTML=logTable(logRows())}
async function delSale(id){
  const s=S.sales.find(x=>x.id===id);if(!s||!(await sure('حذف العملية وإرجاع '+s.qty+' خط للمخزون؟')))return;
  w(()=>sb.from('sales').delete().eq('id',id),'تم الحذف وإرجاع المخزون');
}
async function editSale(id){
  const s=S.sales.find(x=>x.id===id);if(!s)return;
  const r=await modal('تعديل العملية',[{label:'التاريخ',type:'date',value:s.date},{label:'الفرع',opts:S.branches.map(b=>[b.id,b.name]),value:s.branchId},{label:'الموظف',opts:S.emps.map(e=>[e.id,e.name]),value:s.empId},{label:'الشفت',opts:[['morning','صباحي'],['evening','مسائي']],value:s.shift},{label:'نوع الخط',opts:S.types.map(t=>[t.id,t.name]),value:s.typeId},{label:'العدد',type:'number',min:1,value:s.qty},{label:'ملاحظات',value:s.notes||''}]);
  if(!r)return;
  const [date,b,e,sh,t,q0,n]=r,q=+q0;
  if(!date||!(q>0)||!Number.isInteger(q))return toast('أدخل تاريخاً وعدداً صحيحاً أكبر من صفر',1);
  w(()=>sb.from('sales').update({sale_date:date,branch_id:b,employee_id:e,shift:sh,sim_type_id:t,quantity:q,notes:n.trim()||null}).eq('id',id),'تم التعديل وضبط المخزون');
}
function exportCsv(){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[['التاريخ','الفرع','الموظف','الشفت','نوع الخط','العدد','ملاحظات'],...logRows().map(s=>[s.date,nm('branches',s.branchId),nm('emps',s.empId),SH[s.shift],nm('types',s.typeId),s.qty,s.notes||''])];
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`sales-${tz()}.csv`;document.body.appendChild(a);a.click();a.remove();
}
/* ---------- Supabase ---------- */
const CFG_KEY='osb_cfg';
/* اكتب هنا رابط المشروع والمفتاح العام (anon / publishable فقط) ليختفي طلبهم من الزوار */
const DEFAULT_CFG={url:'https://ucldonnhlsghqjthymjp.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjbGRvbm5obHNnaHFqdGh5bWpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1OTkwNjgsImV4cCI6MjExMDE3NTA2OH0.vLG6A8ANzqgl4cqnXd_ryw9Pf47cky5DtR3hJKZNmdE'};
const TB={branches:'branches',emps:'employees',types:'sim_types',inv:'inventory',sales:'sales'};
const MAP={
  branches:r=>({id:r.id,name:r.name}),
  emps:r=>({id:r.id,name:r.full_name,branchId:r.branch_id,target:r.monthly_target,active:r.is_active}),
  types:r=>({id:r.id,name:r.name}),
  inv:r=>({id:r.branch_id+'_'+r.sim_type_id,branchId:r.branch_id,typeId:r.sim_type_id,qty:r.quantity,min:r.min_threshold}),
  sales:r=>({id:r.id,date:r.sale_date,branchId:r.branch_id,empId:r.employee_id,typeId:r.sim_type_id,shift:r.shift,qty:r.quantity,notes:r.notes||'',ts:Date.parse(r.created_at)||0})};
async function load(k){
  let all=[],from=0;
  for(;;){
    let q=sb.from(TB[k]).select('*');
    if(k==='sales')q=q.order('created_at',{ascending:true}).order('id');
    const {data,error}=await q.range(from,from+999);
    if(error){toast('خطأ في تحميل البيانات: '+error.message,1);return}
    all=all.concat(data);if(data.length<1000)break;from+=1000;
  }
  S[k]=all.map(MAP[k]);LD.add(k);render();
}
const loadAll=()=>Promise.all(Object.keys(TB).map(load));
const dbc={};
function subscribe(){
  if(subscribed)return;subscribed=true;
  Object.entries(TB).forEach(([k,t])=>sb.channel('rt-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},()=>{clearTimeout(dbc[k]);dbc[k]=setTimeout(()=>load(k),250)}).subscribe());
}
async function start(){subscribe();await loadAll()}
function vAuth(){
  if(!sb)return `<div class="card" style="max-width:480px;margin:auto"><h3>ربط Supabase</h3>
  <p style="color:var(--mu);font-size:13px">من Supabase: Project Settings ← API. انسخ Project URL ومفتاح anon public (مفتاح عام مصمم للاستخدام في المتصفح).</p>
  <label>Project URL<input id="cu" placeholder="https://xxxx.supabase.co" dir="ltr"></label><br>
  <label>anon public key<input id="ck" dir="ltr"></label><br>
  <button class="p" style="width:100%" onclick="saveCfg()">حفظ والمتابعة</button></div>`;
  return `<div class="card" style="max-width:420px;margin:auto"><h3>تسجيل دخول المدير</h3>
  <label>البريد الإلكتروني<input id="le" type="email" dir="ltr"></label><br>
  <label>كلمة المرور<input id="lp" type="password" dir="ltr" onkeydown="if(event.key==='Enter')login()"></label><br>
  <button class="p" style="width:100%" onclick="login()">دخول</button><br><br>
  <button class="g" onclick="resetCfg()">تغيير إعدادات Supabase</button></div>`;
}
function saveCfg(){
  const url=$('#cu').value.trim().replace(/\/+$/,''),key=$('#ck').value.trim();
  if(!/^https:\/\/.+\.supabase\.co$/.test(url)||key.length<20)return toast('تأكد من الرابط (https://xxxx.supabase.co) والمفتاح',1);
  localStorage.setItem(CFG_KEY,JSON.stringify({url,key}));location.reload();
}
function resetCfg(){localStorage.removeItem(CFG_KEY);location.reload()}
async function login(){
  const {error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});
  if(error)toast('تعذّر الدخول: '+error.message,1);
}
async function logout(){await sb.auth.signOut();sb.removeAllChannels();subscribed=false}
(async()=>{
  let c=null;try{c=JSON.parse(localStorage.getItem(CFG_KEY)||'null')}catch(e){}
  if(!c&&DEFAULT_CFG.url&&DEFAULT_CFG.key)c=DEFAULT_CFG;
  if(!c||!window.supabase){draw();return}
  sb=window.supabase.createClient(c.url,c.key);
  const {data}=await sb.auth.getSession();
  user=data.session?data.session.user:null;
  sb.auth.onAuthStateChange((_e,s)=>{const was=user;user=s?s.user:null;if(user&&!was)start();if(!user){LD.clear();render()}});
  if(user)start();else draw();
})();
</script>
